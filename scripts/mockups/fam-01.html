<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { background: #f6f8fc; }
.bar { background: #f6f8fc; border: none; }
.search { width: 720px; height: 46px; border-radius: 24px; background: #e9eef6; margin-left: 90px; display: flex; align-items: center; padding: 0 18px; color: #5f6368; font-size: 15px; }
.side { position: absolute; top: 64px; left: 0; width: 240px; padding: 8px 12px; }
.compose { display: inline-block; background: #c2e7ff; padding: 18px 26px; border-radius: 16px; font-size: 14px; font-weight: 500; margin: 0 0 14px 4px; }
.nav { padding: 6px 16px 6px 26px; border-radius: 0 16px 16px 0; font-size: 14px; height: 32px; line-height: 20px; }
.nav.on { background: #d3e3fd; font-weight: 700; border-radius: 16px; }
.main { position: absolute; top: 64px; left: 252px; right: 16px; bottom: 16px; background: #fff; border-radius: 16px; padding: 22px 30px; }
.subject { font-size: 22px; font-weight: 400; margin: 6px 0 22px 50px; }
.from { display: flex; gap: 12px; align-items: center; margin-bottom: 26px; }
.from small { color: #5f6368; font-size: 12px; }
.card { width: 560px; margin-left: 50px; border: 1px solid #dadce0; border-radius: 8px; padding: 36px 40px; text-align: center; }
.card .logo { justify-content: center; margin-bottom: 26px; font-size: 24px; }
.card h2 { font-size: 22px; font-weight: 400; margin: 18px 0 12px; }
.card p { font-size: 14px; line-height: 1.7; color: #3c4043; }
.card .btn { margin: 26px 0 18px; padding: 11px 34px; border-radius: 4px; background: #1a73e8; }
</style></head><body>
<div class="bar"><div class="logo">☰&nbsp;&nbsp;<span style="color:#ea4335;font-size:26px">✉</span><b style="color:#5f6368">Gmail</b></div><div class="search">🔍&nbsp;&nbsp;搜索邮件</div><div class="spacer"></div><span class="avatar a3">你</span></div>
<div class="side">
  <div class="compose">✏️&nbsp;&nbsp;写邮件</div>
  <div class="nav on">📥&nbsp;&nbsp;收件箱</div>
  <div class="nav">⭐&nbsp;&nbsp;已加星标</div>
  <div class="nav">🕒&nbsp;&nbsp;已延后</div>
  <div class="nav">➤&nbsp;&nbsp;已发送</div>
  <div class="nav">📄&nbsp;&nbsp;草稿</div>
  <div class="nav">⚠️&nbsp;&nbsp;垃圾邮件</div>
</div>
<div class="main">
  <div class="subject">Alex 邀请您加入其 Google 家庭群组</div>
  <div class="from"><span class="avatar a1">G</span><div><b>Google</b> <small>&lt;families-noreply@google.com&gt;</small><br><small>发送至 我</small></div></div>
  <div class="card">
    <div class="logo"><b><span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g1">g</span><span class="g4">l</span><span class="g2">e</span></b></div>
    <span class="avatar a2" style="width:64px;height:64px;font-size:28px">A</span>
    <h2>Alex 邀请您加入其家庭群组</h2>
    <p>Alex（alex.family@gmail.com）邀请您加入其 Google 家庭群组。<br>加入后，您可以与家庭成员共享 Google 服务。</p>
    <span class="btn btn-primary">接受邀请</span>
    <p class="muted" style="font-size:12px">此邀请将在 14 天后过期。</p>
  </div>
</div>
</body></html>
