<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap { width: 640px; margin: 48px auto 0; border: 1px solid #dadce0; border-radius: 12px; padding: 36px 40px 28px; }
h1 { font-size: 26px; font-weight: 400; margin: 18px 0 10px; }
.who { display: flex; gap: 14px; align-items: center; margin: 22px 0; padding: 14px 16px; background: #f8f9fa; border-radius: 8px; }
ul { margin: 6px 0 0 20px; font-size: 14px; line-height: 2; color: #3c4043; }
.note { font-size: 13px; color: #5f6368; line-height: 1.7; margin-top: 18px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 28px; }
</style></head><body>
<div class="bar"><div class="logo"><b><span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g1">g</span><span class="g4">l</span><span class="g2">e</span></b>&nbsp;家庭</div><div class="spacer"></div><span class="avatar a3">你</span></div>
<div class="wrap">
  <div style="font-size:44px">👨‍👩‍👧‍👦</div>
  <h1>要加入 Alex 的家庭群组吗？</h1>
  <div class="who"><span class="avatar a2">A</span><div><b>Alex</b><br><span class="muted" style="font-size:13px">家庭管理员 · alex.family@gmail.com</span></div></div>
  <div style="font-size:15px;font-weight:500">加入后，您可以：</div>
  <ul>
    <li>共享家庭管理员订阅的 YouTube Premium、Google One 等服务</li>
    <li>使用家庭付款方式（如果管理员已开启）</li>
    <li>与家庭成员共享 Google Play 家庭媒体库中的内容</li>
  </ul>
  <div class="note">家庭群组中的其他成员可以看到您的姓名、照片和电子邮件地址。每 12 个月只能切换一次家庭群组。</div>
  <div class="actions"><span class="btn btn-text">取消</span><span class="btn btn-primary">加入家庭群组</span></div>
</div>
</body></html>
